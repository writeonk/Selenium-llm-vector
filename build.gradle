plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral() // Main repo only
}

dependencies {
    // Selenium WebDriver
    implementation 'org.seleniumhq.selenium:selenium-java:4.35.0'
    implementation 'org.seleniumhq.selenium:selenium-grid:4.35.0'
    implementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.35.0'
    implementation 'org.seleniumhq.selenium:selenium-firefox-driver:4.35.0'
    implementation 'io.github.bonigarcia:webdrivermanager:6.2.0'

    // Apache POI & Excel
    implementation 'org.apache.poi:poi:4.1.2'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'jexcelapi:jxl:2.4.2'

    // Logging
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.24.3'

    // Reporting
    implementation 'com.aventstack:extentreports:5.1.2'

    // Utilities
    implementation 'org.apache.commons:commons-text:1.10.0'
    implementation 'org.apache.commons:commons-email:1.5'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jsoup:jsoup:1.16.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    // AI / DJL - Fully Maven Central compatible
    implementation 'ai.djl:api:0.34.0'                       // DJL API
    implementation 'ai.djl.huggingface:tokenizers:0.34.0'   // HuggingFace Tokenizers
    implementation 'ai.djl.pytorch:pytorch-engine:0.34.0'   // PyTorch Engine
    runtimeOnly 'ai.djl.pytorch:pytorch-native-auto:1.9.1'  // Auto CPU/GPU
    implementation 'ai.djl.pytorch:pytorch-native-cpu:2.7.1' // Fallback CPU

    // Qdrant client
    implementation 'io.qdrant:client:1.15.0'

    // Testing
    testImplementation 'org.testng:testng:7.10.2'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useTestNG()
    testLogging {
        showStandardStreams = true
    }
}