Obtaining a driving license in the UAE involves several steps, which may vary slightly depending on your nationality, the emirate you reside in, and whether you already hold a driving license from another country. Below is a comprehensive, step-by-step guide for new applicants (those who cannot directly transfer a foreign license):
1. Check Eligibility
You must be a UAE resident (citizen or resident visa holder).
Minimum age requirements:
17 years: Motorcycles and vehicles for people with special needs
18 years: Cars and light vehicles
20 years: Heavy vehicles and tractors
21 years: Buses[^1]
2. Gather Required Documents
Original and copy of your passport (with residence visa page)
Original and copy of Emirates ID
Passport-sized photographs (number may vary by emirate)
Eye test report (from an authorized optical shop or driving school)
No Objection Certificate (NOC) from your employer/sponsor (if required by the emirate)[^1][^2]
3. Open a Traffic File
Visit a registered driving institute in your emirate to open a traffic file.
Submit all required documents.
Pay the applicable fees (fees vary by emirate and package)[^1][^2]
4. Take an Eye Test
Complete an eye test at an approved center.
Submit the eye test report to the driving institute or traffic department[^1][^2]
5. Attend Theory Classes
Enroll in theory classes at the driving institute.
Topics include road signs, traffic rules, safe driving practices, and hazard management.
Classes are available in multiple languages and can often be attended online or in person[^1][^3]
6. Pass the Theory Test
After completing theory classes, take the theory test at the institute or RTA center.
The test covers road signs, traffic laws, and safe driving practices.
Remote interpretation is available in many languages for an additional fee[^3]
7. Complete Practical Training
Attend the required number of practical driving lessons (number of hours depends on your previous driving experience and the institute’s policy).
Training includes parking, city driving, and highway driving[^3]
8. Pass Internal Assessments
Pass internal parking and assessment tests at the driving institute before being eligible for the final road test[^3]
9. Take the Final Road Test
Book and take the final road test with the traffic department/RTA.
If you pass, you proceed to the next step. If you fail, you may need to take additional classes and retest[^1][^3]
10. Obtain Your UAE Driving License
Upon passing all required tests, pay the final issuance fee.
Receive your UAE driving license, usually within a few days[^1][^2]
Special Cases
If you hold a valid driving license from certain approved countries, you may be eligible for a direct transfer without tests. Check the latest list on the RTA or local traffic department website[^2][^6].
Diplomats and special categories may have a slightly different process[^4].
Important Notes
Always check the latest requirements and fees with your emirate’s RTA or traffic department, as regulations can change.
All fines must be cleared before license issuance or renewal.
Driving licenses are valid for 10 years for UAE and GCC citizens, and 5 years for residents[^1].
